<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="210">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Neon Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff00a0" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 42px; fill: #00f3ff; letter-spacing: 3px; filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.6)); }
    .subtitle { font-weight: 600; font-size: 15px; fill: #94a3b8; letter-spacing: 4px; text-transform: uppercase; }
    .hud-text { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; }
    .chip-text { font-size: 11px; font-weight: 600; fill: #00f3ff; letter-spacing: 1px; }
    .chip-bg { fill: rgba(0, 243, 255, 0.08); stroke: rgba(0, 243, 255, 0.4); stroke-width: 1; }
    .corner-hud { stroke: #ff007f; stroke-width: 2.5; fill: none; filter: drop-shadow(0 0 4px #ff007f); }
  </style>

  <!-- Background Box -->
  <rect x="2" y="2" width="896" height="206" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g stroke="#00f3ff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="105" x2="900" y2="105" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="180" y1="0" x2="180" y2="210" />
    <line x1="450" y1="0" x2="450" y2="210" />
    <line x1="720" y1="0" x2="720" y2="210" />
  </g>

  <!-- Corner HUD Brackets -->
  <path d="M 12 30 L 12 12 L 30 12" class="corner-hud" />
  <path d="M 888 30 L 888 12 L 870 12" class="corner-hud" />
  <path d="M 12 180 L 12 198 L 30 198" class="corner-hud" />
  <path d="M 888 180 L 888 198 L 870 198" class="corner-hud" />

  <!-- Top HUD Bar -->
  <g transform="translate(35, 32)">
    <circle cx="5" cy="0" r="4" fill="#00ff9d" filter="drop-shadow(0 0 4px #00ff9d)" />
    <text x="18" y="4" class="mono hud-text" font-weight="700" fill="#00ff9d">SYSTEM.ONLINE</text>
    <text x="145" y="4" class="mono hud-text">// NODE_ID: KIMKKATTA</text>
    <text x="320" y="4" class="mono hud-text">// HOST: NICEBYY.GITHUB.IO</text>
    <text x="830" y="4" class="mono hud-text" text-anchor="end">LOC: SEOUL_KR</text>
  </g>

  <!-- Top Divider Line -->
  <line x1="35" y1="46" x2="865" y2="46" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Main Identity Section -->
  <g transform="translate(450, 102)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="0" class="mono title">kimkkatta // DEV.LOG</text>
    <!-- Subtitle -->
    <text x="0" y="26" class="sans subtitle">Full-Stack &amp; Backend Engineer</text>
  </g>

  <!-- Bottom Tech Stack Chips -->
  <g transform="translate(450, 168)">
    <!-- Chip 1: Spring Boot -->
    <g transform="translate(-290, 0)">
      <rect x="-65" y="-14" width="130" height="26" rx="4" class="chip-bg" />
      <text x="0" y="4" class="mono chip-text" text-anchor="middle">SPRING BOOT</text>
    </g>

    <!-- Chip 2: Java / Kotlin -->
    <g transform="translate(-145, 0)">
      <rect x="-65" y="-14" width="130" height="26" rx="4" class="chip-bg" />
      <text x="0" y="4" class="mono chip-text" text-anchor="middle">JAVA / KOTLIN</text>
    </g>

    <!-- Chip 3: JPA / Hibernate -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="26" rx="4" class="chip-bg" />
      <text x="0" y="4" class="mono chip-text" text-anchor="middle">JPA / REDIS</text>
    </g>

    <!-- Chip 4: TypeScript -->
    <g transform="translate(145, 0)">
      <rect x="-65" y="-14" width="130" height="26" rx="4" class="chip-bg" />
      <text x="0" y="4" class="mono chip-text" text-anchor="middle">TYPESCRIPT</text>
    </g>

    <!-- Chip 5: Next.js / Web -->
    <g transform="translate(290, 0)">
      <rect x="-65" y="-14" width="130" height="26" rx="4" class="chip-bg" />
      <text x="0" y="4" class="mono chip-text" text-anchor="middle">MODERN WEB</text>
    </g>
  </g>

  <!-- Bottom Accent Neon Line -->
  <line x1="200" y1="198" x2="700" y2="198" stroke="url(#borderGrad)" stroke-width="2" filter="url(#neonGlow)" />
</svg>
